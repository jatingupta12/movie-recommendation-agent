[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "weekend-watch-agent"
version = "0.1.0"
description = "A personal local movie and TV recommendation agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic-settings>=2.2", "python-dotenv>=1.0", "httpx>=0.27", "mcp>=2.0,<3", "fastapi>=0.115", "uvicorn>=0.30"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
weekend-watch = "weekend_watch.cli:main"
weekend-watch-mcp = "weekend_watch.mcp_server:main"
weekend-watch-api = "weekend_watch.api:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
